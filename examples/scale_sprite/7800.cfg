# ld65 linker configuration for Atari 7800 32KB ROM

MEMORY {
    ZP:      start = $0040, size = $00C0, type = rw, define = yes;
    RAM:     start = $1800, size = $0800, type = rw, define = yes;
    ROM:     start = $8000, size = $7FF8, fill = yes, fillval = $FF, file = %O;
    VECTORS: start = $FFF8, size = $0008, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss;
    CODE:     load = ROM,     type = ro,  align = $100;
    RODATA:   load = ROM,     type = ro,  align = $100;
    VECTORS:  load = VECTORS, type = ro;
}
