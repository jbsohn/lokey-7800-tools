# ld65 linker configuration for the Silly Bugs demo (32KB cartridge).
#
# 16-line sprites move to any scanline. Maria adds the zone offset to the
# graphics high byte, so a sprite that is not on a zone boundary reads the
# 4KB block above and below its bitmap. DLL bit 6 (16-line holey DMA) makes
# those odd 4KB regions ($9xxx, $Bxxx, $Dxxx, $Fxxx) read as zero. Each
# sprite therefore occupies one even 4KB block by itself:
#
#   $A000 beetle, $C000 circle, $E000 square
#
# Code and the display-list list live in $8000-$9FFF. Holey reads of $9xxx
# return zero to Maria; the CPU still executes whatever sits there.

MEMORY {
    ZP:      start = $0040, size = $00C0, type = rw, define = yes;
    RAM0:    start = $1800, size = $0800, type = rw, define = yes;
    RAM1:    start = $2200, size = $0600, type = rw, define = yes;
    ROM:     start = $8000, size = $2000, fill = yes, fillval = $FF, file = %O;
    GFX0:    start = $A000, size = $1000, fill = yes, fillval = $00, file = %O;
    HOLEB:   start = $B000, size = $1000, fill = yes, fillval = $FF, file = %O;
    GFX1:    start = $C000, size = $1000, fill = yes, fillval = $00, file = %O;
    HOLED:   start = $D000, size = $1000, fill = yes, fillval = $FF, file = %O;
    GFX2:    start = $E000, size = $1000, fill = yes, fillval = $00, file = %O;
    HOLEF:   start = $F000, size = $0FF8, fill = yes, fillval = $FF, file = %O;
    VECTORS: start = $FFF8, size = $0008, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM0,    type = bss;
    DLBUF1:   load = RAM1,    type = bss;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    GFX0:     load = GFX0,    type = ro, align = $100;
    GFX1:     load = GFX1,    type = ro, align = $100;
    GFX2:     load = GFX2,    type = ro, align = $100;
    VECTORS:  load = VECTORS, type = ro;
}
