[package]
name = "rom2a78"
version.workspace = true
edition.workspace = true
description = "Atari 7800 .a78 ROM header utility adhering to the 8BitDev specification"
license = "MIT"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[package.metadata.deb]
maintainer = "John Sohn <john.sohn@gmail.com>"
copyright = "2026 John Sohn"
extended-description = "Atari 7800 .a78 ROM header generator, inspector, and stripper."
section = "utils"
priority = "optional"
assets = [
    ["target/x86_64-unknown-linux-gnu/release/rom2a78", "usr/bin/rom2a78", "755"],
    ["README.md", "usr/share/doc/rom2a78/README.md", "644"],
    ["LICENSE", "usr/share/doc/rom2a78/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/x86_64-unknown-linux-gnu/release/rom2a78", dest = "/usr/bin/rom2a78", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/rom2a78/README.md", mode = "0644" },
    { source = "LICENSE", dest = "/usr/share/doc/rom2a78/LICENSE", mode = "0644" }
]

[lints]
workspace = true
