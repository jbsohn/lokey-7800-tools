# 32KB cartridge map for a lokeydll game.
#
# A picture is one a78gfx bitmap in LOKEYDLL_GFX0, LOKEYDLL_GFX1, or
# LOKEYDLL_GFX2. Maria adds the zone offset to the graphics high byte, so a
# sprite that is not on a zone boundary reads the 4KB block above and below
# its bitmap. 16-line holey DMA makes the odd blocks ($9xxx, $Bxxx, $Dxxx,
# $Fxxx) read as zero. Each slot is one even 4KB block:
#
#   LOKEYDLL_GFX0 $A000, LOKEYDLL_GFX1 $C000, LOKEYDLL_GFX2 $E000
#
# Code lives in $8000-$9FFF. A holey read of $9xxx returns zero to Maria; the
# CPU still executes whatever sits there.
#
# Game state is BSS, in RAM at $2200. Library state, the two pools, and the
# two display-list lists sit below that in $1800-$1E7F; the 384 bytes at
# $1E80-$1FFF are left free. The 7800's usable RAM is $1800-$1FFF (2K) plus
# $2200-$27FF (1.5K); $2000-$21FF is a hardware hole and must not be used.
#
# LOKEYDLL_STATE holds the object tables (6 bytes/sprite: x, y, and the
# picture fields set by lokeydll_set_picture) plus the zone tables. Each
# object column is aligned so an index of 0..59 never crosses a page.
# $0200 fits 60 sprites, which is also the point where a fully-spilled
# frame (2 headers/sprite) exhausts one 512-byte pool.
#
# LOKEYDLL_ZONE is a 256-byte Y-to-zone table. It has to start on a page
# so lda table,x stays 4 cycles for every Y.

MEMORY {
    ZP:             start = $0040, size = $0040, type = rw, define = yes;
    LOKEYDLL_ZP:    start = $0080, size = $0010, type = rw, define = yes;
    LOKEYDLL_STATE: start = $1800, size = $0200, type = rw, define = yes;
    LOKEYDLL_RAM_A: start = $1A00, size = $0200, type = rw, define = yes;
    LOKEYDLL_RAM_B: start = $1C00, size = $0200, type = rw, define = yes;
    LOKEYDLL_DLL:   start = $1E00, size = $0080, type = rw, define = yes;
    RAM:            start = $2200, size = $0600, type = rw, define = yes;
    ROM:            start = $8000, size = $2000, fill = yes, fillval = $FF, file = %O;
    GFX0:           start = $A000, size = $1000, fill = yes, fillval = $00, file = %O;
    HOLEB:          start = $B000, size = $1000, fill = yes, fillval = $FF, file = %O;
    GFX1:           start = $C000, size = $1000, fill = yes, fillval = $00, file = %O;
    HOLED:          start = $D000, size = $1000, fill = yes, fillval = $FF, file = %O;
    GFX2:           start = $E000, size = $1000, fill = yes, fillval = $00, file = %O;
    HOLEF:          start = $F000, size = $0FF8, fill = yes, fillval = $FF, file = %O;
    VECTORS:        start = $FFF8, size = $0008, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    ZEROPAGE:       load = ZP,             type = zp;
    LOKEYDLL_ZP:    load = LOKEYDLL_ZP,    type = zp;
    LOKEYDLL_STATE: load = LOKEYDLL_STATE, type = bss, align = $40;
    LOKEYDLL_RAM_A: load = LOKEYDLL_RAM_A, type = bss;
    LOKEYDLL_RAM_B: load = LOKEYDLL_RAM_B, type = bss;
    LOKEYDLL_DLL:   load = LOKEYDLL_DLL,   type = bss;
    BSS:            load = RAM,            type = bss;
    CODE:           load = ROM,            type = ro;
    RODATA:         load = ROM,            type = ro;
    LOKEYDLL_ZONE:  load = ROM,            type = ro, align = $100;
    LOKEYDLL_GFX0:  load = GFX0,           type = ro, align = $100;
    LOKEYDLL_GFX1:  load = GFX1,           type = ro, align = $100;
    LOKEYDLL_GFX2:  load = GFX2,           type = ro, align = $100;
    VECTORS:        load = VECTORS,        type = ro;
}
